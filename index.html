<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Restaurante da Cátia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fceea7; margin: 0; padding: 20px; color: #333; }
        .admin-card { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.15); border-top: 6px solid #580000; }
        h2 { color: #580000; margin-top: 0; border-bottom: 2px solid #580000; padding-bottom: 8px; text-align: center; }
        h3 { color: #580000; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-top: 25px; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #580000; }
        input[type="time"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 1em; }
        .status-geral-box { background: #fff8d6; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 2px solid #580000; }
        .btn-status-geral { padding: 12px 20px; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; color: white; width: 100%; margin-top: 10px; }
        .btn-status-geral.aberto { background-color: #27ae60; }
        .btn-status-geral.fechado { background-color: #c0392b; }
        .item-status { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .item-status span { font-weight: bold; color: #580000; }
        .btn-toggle { padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-toggle.disponivel { background-color: #27ae60; }
        .btn-toggle.esgotado { background-color: #e74c3c; }
        .btn-save { width: 100%; background: #580000; color: #ffcc00; border: 1px solid #ffcc00; padding: 12px; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .status-msg { margin-top: 15px; padding: 10px; background: #d4edda; color: #155724; border-radius: 5px; display: none; text-align: center; font-weight: bold; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="admin-card">
        <h2>Gestão do Restaurante</h2>
        
        <div class="status-geral-box">
            <label>Estado Atual do Restaurante:</label>
            <button id="btnGeral" class="btn-status-geral aberto" onclick="alternarEstadoGeral()">RESTAURANTE ABERTO</button>
        </div>

        <div class="form-group">
            <label for="fechoHora">Hora de Fecho do Restaurante:</label>
            <input type="time" id="fechoHora" value="22:30">
        </div>

        <h3>Disponibilidade dos Pratos</h3>

        <div class="item-status">
            <span>Lula Frita</span>
            <button id="btnLula" class="btn-toggle disponivel" onclick="alternarEstado('Lula')">Disponível</button>
        </div>

        <div class="item-status">
            <span>Frango Grelhado</span>
            <button id="btnFrango" class="btn-toggle disponivel" onclick="alternarEstado('Frango')">Disponível</button>
        </div>

        <div class="item-status">
            <span>Fígado da Casa</span>
            <button id="btnFigado" class="btn-toggle disponivel" onclick="alternarEstado('Figado')">Disponível</button>
        </div>

        <div class="item-status">
            <span>Peixe Frito/Grelhado</span>
            <button id="btnPeixe" class="btn-toggle disponivel" onclick="alternarEstado('Peixe')">Disponível</button>
        </div>

        <button class="btn-save" onclick="guardarConfiguracoes()">Salvar Alterações</button>

        <div id="msgSucesso" class="status-msg">Atualizado no Firebase com sucesso!</div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCwwMaLp8KTK9kKsnaSRWQto1XsiR1tzIw",
          authDomain: "restaurante-da-katia.firebaseapp.com",
          databaseURL: "https://restaurante-da-katia-default-rtdb.firebaseio.com",
          projectId: "restaurante-da-katia",
          storageBucket: "restaurante-da-katia.firebasestorage.app",
          messagingSenderId: "30654757331",
          appId: "1:30654757331:web:6b092238eb3e06596ad726"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let restauranteAberto = true;
        let estados = { Lula: true, Frango: true, Figado: true, Peixe: true };

        window.onload = function() {
            database.ref('configuracoes').once('value', (snapshot) => {
                const data = snapshot.val() || {};
                if (data.fechoHora) document.getElementById('fechoHora').value = data.fechoHora;
                if (data.restauranteAberto !== undefined) restauranteAberto = data.restauranteAberto;
                atualizarBotaoGeral();
            });

            database.ref('estoque').once('value', (snapshot) => {
                const estoque = snapshot.val() || {};
                ['Lula', 'Frango', 'Figado', 'Peixe'].forEach(item => {
                    if (estoque[item] !== undefined) {
                        estados[item] = estoque[item];
                    }
                    atualizarBotaoUI(item);
                });
            });
        };

        function alternarEstadoGeral() {
            restauranteAberto = !restauranteAberto;
            atualizarBotaoGeral();
        }

        function atualizarBotaoGeral() {
            let btn = document.getElementById('btnGeral');
            if(restauranteAberto) {
                btn.innerText = "RESTAURANTE ABERTO";
                btn.className = "btn-status-geral aberto";
            } else {
                btn.innerText = "RESTAURANTE FECHADO";
                btn.className = "btn-status-geral fechado";
            }
        }

        function alternarEstado(item) {
            estados[item] = !estados[item];
            atualizarBotaoUI(item);
        }

        function atualizarBotaoUI(item) {
            let btn = document.getElementById('btn' + item);
            if(estados[item]) {
                btn.innerText = "Disponível";
                btn.className = "btn-toggle disponivel";
            } else {
                btn.innerText = "Esgotado";
                btn.className = "btn-toggle esgotado";
            }
        }

        function guardarConfiguracoes() {
            database.ref('configuracoes').set({
                restauranteAberto: restauranteAberto,
                fechoHora: document.getElementById('fechoHora').value
            });

            database.ref('estoque').set(estados);

            let msg = document.getElementById('msgSucesso');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
